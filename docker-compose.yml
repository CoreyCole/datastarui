services:
  # Echo server with Air live reload
  app:
    build:
      context: .
      target: development
    ports:
      - "4242:4242"
    volumes:
      - .:/app # Mount local files
    environment:
      - CGO_ENABLED=0
      - GOOS=linux
      - GO111MODULE=on
    working_dir: /app
    command: sh -c "go mod download && air" # Download modules first, then start air
    depends_on:
      - tailwind
    networks:
      - datastarui-network
  # Tailwind CSS watcher
  tailwind:
    build:
      context: .
      target: development
    volumes:
      - .:/app # Mount local files
    working_dir: /app
    command: sh -c "echo 'Starting Tailwind CSS watcher...' && /usr/local/bin/tailwindcss -i static/css/index.css -o static/css/build.css --watch --content './components/**/*.templ' --content './pages/**/*.templ' --content './layouts/**/*.templ'"
    networks:
      - datastarui-network
volumes:
  go-mod-cache:
  air-tmp:
networks:
  datastarui-network:
    driver: bridge
