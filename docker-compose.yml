services:
  # Echo server with Air live reload
  app:
    build:
      context: .
      target: development
    ports:
      - "4242:4242"
    volumes:
      - .:/app # Mount local files
    environment:
      - CGO_ENABLED=0
      - GOOS=linux
      - GO111MODULE=on
    working_dir: /app
    command: sh -c "just watch"
    depends_on:
      - tailwind
    networks:
      - datastarui-network
  # Tailwind CSS watcher
  tailwind:
    build:
      context: .
      dockerfile: Dockerfile.tailwind
    volumes:
      - .:/app # Mount local files
    working_dir: /app
    tty: true
    command: sh -c "echo 'Starting Tailwind CSS watcher...' && mkdir -p node_modules && ln -sf /usr/local/lib/node_modules/tailwindcss node_modules/tailwindcss && echo 'Starting watch...' && npx tailwindcss -i static/css/index.css -o static/css/build.css --watch --content './components/**/*.templ' --content './pages/**/*.templ' --content './layouts/**/*.templ'"
    networks:
      - datastarui-network
volumes:
  go-mod-cache:
  air-tmp:
networks:
  datastarui-network:
    driver: bridge
