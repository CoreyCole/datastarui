services:
  # Echo server with Air live reload
  app:
    build:
      context: .
      target: development
    ports:
      - "4242:4242"
    volumes:
      - .:/app # Mount local files
    environment:
      - CGO_ENABLED=0
      - GOOS=linux
      - GO111MODULE=on
    working_dir: /app
    command: sh -c "just watch"
    networks:
      - datastarui-network
volumes:
  go-mod-cache:
  air-tmp:
networks:
  datastarui-network:
    driver: bridge
